<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Camino de progreso</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1ee;font-family:system-ui,sans-serif;color:#222}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:#fff;padding:0 16px 32px}
header{display:flex;align-items:center;gap:8px;padding:14px 0;position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:1.15rem;margin:0}
.back{border:0;background:none;font-size:1rem;color:#2e7d32;padding:8px 4px}
label{display:block;margin:12px 0 4px;font-size:.9rem}
input,select{width:100%;padding:14px;font-size:1rem;border:1px solid #bbb;border-radius:10px}
input[type=checkbox]{width:auto;margin-right:8px}
.btn{display:block;width:100%;padding:15px;margin-top:16px;font-size:1rem;border:0;border-radius:12px;background:#2e7d32;color:#fff;text-align:center;text-decoration:none}
.btn.sec{background:#e8f0e8;color:#2e7d32}
.btn.wa{background:#25d366}
.btn.red{background:#c62828}
.link{background:none;border:0;color:#2e7d32;text-decoration:underline;font-size:.95rem;padding:12px 0}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:10px 0;border:2px solid #2e7d32;border-radius:14px;background:#fff;font-size:1rem;text-align:left}
.step .n{flex:none;width:40px;height:40px;border-radius:50%;background:#2e7d32;color:#fff;display:grid;place-items:center;font-weight:700}
.step.locked{border-color:#ccc;color:#999;background:#f3f3f3}
.step.locked .n{background:#bbb}
.step.done{background:#e8f5e9}
.card{background:#f3f7f3;border-radius:14px;padding:16px;margin:14px 0;text-align:center}
.err{color:#c62828;font-size:.9rem;margin-top:10px}
.hint{font-size:.8rem;color:#666}
</style>
</head>
<body>
<div id="app">Cargando…</div>
<script type="module" src="app.js"></script>
</body>
</html>
