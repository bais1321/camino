<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#134b3a">
<title>Camino de progreso</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--g:#134b3a;--g2:#1d6a51;--gold:#d4b46a;--bg:#eef1f4;--ink:#15281f;--mut:#667a72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1000px 500px at 50% -10%,#e0e9e5,var(--bg))}
#app{max-width:480px;min-height:100vh;margin:0 auto;padding:0 18px 40px}
#app>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
#app>:nth-child(2){animation-delay:.06s}#app>:nth-child(3){animation-delay:.12s}#app>:nth-child(4){animation-delay:.18s}#app>:nth-child(n+5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
header{display:flex;align-items:center;gap:10px;padding:18px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
header h1{flex:1;margin:0;font-size:1.35rem;letter-spacing:-.02em}
.back{border:0;background:#fff;box-shadow:0 2px 8px #0001;border-radius:999px;padding:9px 14px;font-size:.9rem;font-weight:600;color:var(--g)}
.avatar{width:42px;height:42px;border:0;border-radius:50%;color:#fff;font-weight:700;font-size:1.05rem;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 4px 12px #134b3a55}
.hero{text-align:center;padding:44px 0 14px}
.hero h1{margin:14px 0 4px;font-size:1.7rem;letter-spacing:-.03em}
.hero p{margin:0;color:var(--mut)}
.logo{width:84px;height:84px;margin:0 auto;border-radius:28px;display:grid;place-items:center;font-size:2.3rem;color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 12px 28px #134b3a44;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(3deg)}}
label{display:block;margin:14px 0 6px;font-size:.85rem;font-weight:600;color:var(--mut)}
input,select{width:100%;padding:15px;font-size:1rem;color:var(--ink);background:#fff;border:2px solid #e1eae6;border-radius:14px;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 4px #1d6a5126}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--g)}
.btn{display:block;width:100%;margin-top:16px;padding:15px;font-size:1rem;font-weight:700;letter-spacing:.01em;color:#fff;text-align:center;text-decoration:none;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 6px 16px #134b3a40;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.sec{color:var(--g);background:#e4f1ec;box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#1ebe5b,#25d366);box-shadow:0 6px 16px #25d36640}
.btn.red{background:linear-gradient(135deg,#c62828,#e5484d);box-shadow:0 6px 16px #c6282833}
.btn:disabled{opacity:.6}
.link{background:none;border:0;padding:14px 0;font-size:.95rem;color:var(--g);font-weight:600}
.card{margin:14px 0;padding:18px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 6px 20px #15302a14}
.card .btn{margin-top:10px;padding:12px}
.fiesta{background:linear-gradient(135deg,#fff3d1,#ffe29a);font-weight:600}
.bounce{display:block;font-size:2.2rem;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:translateY(-8px) scale(1.1)}}
.err{margin-top:10px;font-size:.9rem;color:#c62828}
.hint{font-size:.8rem;color:var(--mut);line-height:1.5}
.prog{margin:6px 0 10px;padding:16px;background:#fff;border-radius:20px;box-shadow:0 6px 20px #15302a14}
.prog-t{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.9rem;color:var(--mut)}
.prog-t b{color:var(--g);font-size:1rem}
.bar{height:12px;overflow:hidden;background:#e4efea;border-radius:99px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--gold));animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.path::before{content:"";position:absolute;top:34px;bottom:34px;left:50%;border-left:4px dotted #bcd3cb;transform:translateX(-50%)}
.node{position:relative;width:80%;padding:6px;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;font:inherit;color:var(--ink);transform:translateX(var(--x,0));animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.node:nth-child(4n+2){--x:-46px}.node:nth-child(4n+4){--x:46px}
.node:nth-child(2){animation-delay:.1s}.node:nth-child(3){animation-delay:.18s}.node:nth-child(4){animation-delay:.26s}.node:nth-child(n+5){animation-delay:.34s}
@keyframes pop{from{opacity:0;transform:translateX(var(--x,0)) scale(.6)}}
.dot{width:68px;height:68px;display:grid;place-items:center;border-radius:50%;font-size:1.5rem;font-weight:800;color:#fff;background:#c9d3cf;box-shadow:0 6px 0 #aab6b1;transition:.12s}
.node:active .dot{transform:translateY(4px);box-shadow:0 2px 0 #aab6b1}
.lbl{padding:3px 9px;font-size:.82rem;font-weight:600;line-height:1.25;text-align:center;background:#ffffffd9;border-radius:9px}
.node.locked .lbl{font-weight:500;color:var(--mut)}
.node.open .dot{background:var(--gold);box-shadow:0 6px 0 #a8852f;animation:pulse 1.8s infinite}
.node.done .dot{background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 6px 0 #14493d}
@keyframes pulse{0%{box-shadow:0 6px 0 #a8852f,0 0 0 0 #d4b46a99}100%{box-shadow:0 6px 0 #a8852f,0 0 0 20px #d4b46a00}}
.step{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:14px;font-size:1rem;text-align:left;color:var(--ink);background:#fff;border:0;border-radius:18px;box-shadow:0 6px 20px #15302a14;transition:.15s}
.step:active{transform:scale(.98)}
.step .n{flex:none;min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));border-radius:14px}
.badge{padding:6px 12px;font-size:.75rem;font-weight:700;color:var(--g);background:#dff0e9;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.stat{padding:14px 6px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 6px 20px #15302a14}
.stat b{display:block;font-size:1.6rem;color:var(--g)}.stat span{font-size:.72rem;color:var(--mut)}
.prow{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:12px;font:inherit;text-align:left;color:var(--ink);background:#fff;border:0;border-radius:18px;box-shadow:0 6px 20px #15302a14;transition:.15s}
.prow:active{transform:scale(.98)}
.prow .avatar{display:grid;place-items:center;flex:none}
.pinfo{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.mini{display:block;height:6px;overflow:hidden;background:#e4efea;border-radius:9px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));border-radius:9px}
.cnt{font-weight:700;font-size:.9rem;color:var(--g)}
.avatar.big{display:grid;place-items:center;width:68px;height:68px;margin:0 auto;font-size:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{padding:5px 11px;font-size:.78rem;color:var(--g);background:#e4f1ec;border-radius:99px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{position:relative;display:flex;gap:12px;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:#d5e4de}
.tl:last-of-type::before{display:none}
.tl-dot{z-index:1;flex:none;width:40px;height:40px;display:grid;place-items:center;font-weight:700;color:#fff;background:#c9d3cf;border-radius:50%}
.tl.ok .tl-dot{background:linear-gradient(135deg,var(--g),var(--g2))}.tl.open .tl-dot{background:var(--gold)}
.tl-body{flex:1;min-width:0;padding:14px;font-size:.9rem;line-height:1.5;background:#fff;border-radius:16px;box-shadow:0 6px 20px #15302a14}
.tl-body .btn{margin-top:10px;padding:11px;font-size:.9rem}
.bar{background:#e3d3a2}.bar i{background:var(--g)}.mini{background:#e3d3a2}.mini i{background:var(--g)}
.who{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:12px 16px;background:#fff;border-radius:99px;box-shadow:0 6px 20px #15302a14}
.who b{font-size:1.1rem}.who .bar{flex:1;height:12px}
.cnt{font-weight:700;font-size:.85rem;color:var(--g);white-space:nowrap}
.snake{display:flex;flex-direction:column;gap:24px;padding:12px 0 6px}
.srow{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.srow.rev{direction:rtl}.srow.rev>*{direction:ltr}
.srow::before{content:"";position:absolute;left:16%;right:16%;top:27px;border-top:3px dotted #b8c4be}
.cell{position:relative;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;font:inherit;color:var(--ink);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.cell:not(:last-child)::after{content:"▸";position:absolute;top:14px;right:-14px;color:var(--gold);font-size:1rem;z-index:2}
.rev .cell:not(:last-child)::after{content:"◂";right:auto;left:-14px}
.cdot{z-index:1;width:54px;height:54px;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:var(--gold);background:var(--g);border-radius:50%;box-shadow:0 4px 10px #134b3a55}
.ccard{width:100%;min-height:96px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.78rem;font-weight:700;line-height:1.2;text-align:center;background:#fff;border-radius:14px;box-shadow:0 4px 14px #0f2a2220}
.ccard i{font-style:normal;font-size:1.5rem}
.ccard em{padding:4px 9px;font-style:normal;font-size:.68rem;color:#fff;background:var(--gold);border-radius:99px}
.cell.locked .cdot{color:#fff;background:#c3c9c6;box-shadow:none}
.cell.locked .ccard{color:#8a948f;background:#e3e6e4;box-shadow:none}
.cell.locked .ccard i{opacity:.55;filter:grayscale(1)}
.cell.open .cdot{color:#fff;background:var(--gold);animation:pulse 1.8s infinite}
.cell.open .ccard{border:2px solid var(--gold)}
.cell:nth-child(2){animation-delay:.1s}.cell:nth-child(3){animation-delay:.2s}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
.kpi{padding:14px;color:#fff;background:var(--g);border-radius:18px;box-shadow:0 6px 18px #134b3a33}
.kpi.gold{background:var(--gold)}
.kpi.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.kpi span{display:block;font-size:.78rem;opacity:.92}
.kpi b{display:block;margin-top:4px;font-size:2rem;line-height:1.1}
.kpi .mini{margin-top:10px;background:#ffffff33}.kpi .mini i{background:#7fc58f}
.ring{position:relative;width:70px;height:70px;display:grid;place-items:center;background:conic-gradient(#7fc58f calc(var(--p)*1%),#ffffff2e 0);border-radius:50%}
.ring::before{content:"";position:absolute;inset:8px;background:var(--g);border-radius:50%}
.ring em{position:relative;font-style:normal;font-size:.85rem;font-weight:700}
.sec{margin:20px 0 10px;font-size:1.05rem;font-weight:600}
.act{padding:2px 0}
.ai{position:relative;display:flex;gap:12px;padding-bottom:14px;font-size:.85rem;line-height:1.4}
.ai::before{content:"";position:absolute;left:5px;top:15px;bottom:-3px;width:2px;background:#e3d3a2}
.ai:last-child{padding-bottom:0}.ai:last-child::before{display:none}
.ad{z-index:1;flex:none;width:12px;height:12px;margin-top:3px;background:var(--g);border:2px solid var(--gold);border-radius:50%}
</style>
</head>
<body>
<div id="app">Cargando…</div>
<script type="module" src="app.js"></script>
</body>
</html>
